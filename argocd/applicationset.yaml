apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: featureboard
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
  template:
    metadata:
      name: 'featureboard-{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Explotion80/featureboard.git
        targetRevision: main
        path: k8s/featureboard
        helm:
          valueFiles:
            - '../values-{{.env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'featureboard-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true